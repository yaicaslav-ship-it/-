name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Unzip and build
        run: |
          unzip -q mentionsound.zip -d unpacked
          SETTINGS=$(find unpacked -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside mentionsound.zip" >&2
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mentionsound
          path: out/*.jar
